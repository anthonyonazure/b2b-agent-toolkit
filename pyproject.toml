[project]
name = "b2b-agent-toolkit"
version = "0.1.0"
description = "Reusable B2B integration adapters for AI agents (HubSpot, M365, Zendesk, custom portal APIs)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anthony" }]
dependencies = [
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "msgraph-sdk>=1.2",
    "azure-identity>=1.15",
    "structlog>=24.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b2b_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
